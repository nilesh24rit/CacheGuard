spring:
  application:
    name: CacheGuard
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2000ms}

server:
  port: 8080

cacheguard:
  risk:
    # distinct devices before a risk-point bump is triggered
    deviceCountThreshold: 3
    # score ceiling for normal (allowed) login attempts
    allowScoreMax: 30.0
    # score ceiling above which a CAPTCHA challenge is required
    captchaScoreMax: 60.0
